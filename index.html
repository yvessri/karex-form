<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KareX</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Prompt', 'Sarabun', sans-serif;
      background: #F4F7F5;
      color: #1a2e24;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .logo {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #1a6b4a;
      margin-bottom: 8px;
    }

    .title {
      font-size: 24px;
      font-weight: 600;
      color: #1a2e24;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      font-size: 14px;
      color: #7a9e88;
      text-align: center;
      margin-bottom: 40px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: white;
      border: 1.5px solid #d0e4d8;
      border-radius: 16px;
      padding: 24px;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.1s;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
    }

    .card:hover {
      border-color: #1a6b4a;
      box-shadow: 0 4px 16px rgba(26,107,74,0.1);
    }

    .card:active { transform: scale(0.98); }

    .card-icon {
      width: 52px;
      height: 52px;
      background: #e8f7ee;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
    }

    .card-text .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a2e24;
      margin-bottom: 4px;
    }

    .card-text .card-desc {
      font-size: 13px;
      color: #7a9e88;
      line-height: 1.5;
    }

    .loading {
      font-size: 14px;
      color: #7a9e88;
    }

    .username {
      font-size: 14px;
      color: #3a5a46;
      margin-bottom: 32px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="logo">KareX</div>
  <div class="title">ยินดีต้อนรับ</div>
  <div id="username" class="username">กำลังโหลด...</div>
  <div class="subtitle">คุณต้องการลงทะเบียนในฐานะ</div>

  <a class="card" href="./karex-caregiver-form.html">
    <div class="card-icon">👤</div>
    <div class="card-text">
      <div class="card-title">ผู้ดูแล (Caregiver)</div>
      <div class="card-desc">สำหรับผู้ที่ต้องการให้บริการดูแลผู้สูงอายุ</div>
    </div>
  </a>

  <a class="card" href="./karex-facility-form.html">
    <div class="card-icon">🏥</div>
    <div class="card-text">
      <div class="card-title">สถานบริบาล (Facility)</div>
      <div class="card-desc">สำหรับสถานที่ให้บริการดูแลผู้สูงอายุ</div>
    </div>
  </a>

  <script>
    liff.init({ liffId: "2011631966-DJthP9FI })
      .then(() => {
        if (liff.isLoggedIn()) {
          liff.getProfile().then(profile => {
            document.getElementById('username').textContent = 'สวัสดี, ' + profile.displayName;
          });
        } else {
          liff.login();
        }
      })
      .catch(err => {
        console.error(err);
        document.getElementById('username').textContent = '';
      });
  </script>
</body>
</html>
